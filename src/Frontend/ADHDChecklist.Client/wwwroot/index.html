<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloomento</title>

    <link rel="icon" type="image/png" href="logo.png" />
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: 'rgb(var(--color-primary-50) / <alpha-value>)',
                            100: 'rgb(var(--color-primary-100) / <alpha-value>)',
                            200: 'rgb(var(--color-primary-200) / <alpha-value>)',
                            300: 'rgb(var(--color-primary-300) / <alpha-value>)',
                            400: 'rgb(var(--color-primary-400) / <alpha-value>)',
                            500: 'rgb(var(--color-primary-500) / <alpha-value>)',
                            600: 'rgb(var(--color-primary-600) / <alpha-value>)',
                            700: 'rgb(var(--color-primary-700) / <alpha-value>)',
                            800: 'rgb(var(--color-primary-800) / <alpha-value>)',
                            900: 'rgb(var(--color-primary-900) / <alpha-value>)',
                            950: 'rgb(var(--color-primary-950) / <alpha-value>)',
                        }
                    }
                }
            }
        }
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JWJ68QKLTR"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-JWJ68QKLTR', { 'send_page_view': false });

        window.trackPageLevel = (measurementId, path) => {
            gtag('config', measurementId, { 'page_path': path });
        };
    </script>
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="ADHDChecklist.Client.styles.css" rel="stylesheet" /> -->
    <!-- Custom DragDrop Logic used, no external CSS needed -->
    <!-- <link href="_content/Plk.Blazor.DragDrop/dragdrop.css" rel="stylesheet" /> -->
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="logo.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="logo.png" />
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                }
            });
        }
    </script>
</head>
<script>
    (function () {
        try {
            const themeColor = localStorage.getItem('theme-color') || 'indigo';
            const themeMode = localStorage.getItem('theme-mode') || 'light';
            document.documentElement.classList.add('theme-' + themeColor);
            if (themeMode === 'dark') {
                document.documentElement.classList.add('dark');
            }
        } catch (e) { }
    })();
</script>

<body class="transition-colors duration-200">

    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/editor.js"></script>
    <script>
        navigator.serviceWorker.register('service-worker.js');
    </script>
</body>

</html>
